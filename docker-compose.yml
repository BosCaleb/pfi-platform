# CyberFit Backend — Docker Compose
#
# Prerequisites:
#   1. Copy .env.example → .env and fill in real values.
#   2. Never commit .env to version control.
#
# Usage:
#   docker compose up --build        # first run
#   docker compose up -d             # subsequent runs (detached)
#   docker compose down              # stop and remove containers

name: pfi-platform

services:
  pfi-api:
    build: .
    container_name: pfi-api
    ports:
      - "8000:8000"
    volumes:
      # Persist the DuckDB database file between container restarts.
      - ./data:/app/data
    env_file:
      # All secrets and configuration are loaded from .env.
      # See .env.example for the full list of required variables.
      - .env
    environment:
      # Override PYTHONUNBUFFERED so logs appear immediately in docker logs.
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
