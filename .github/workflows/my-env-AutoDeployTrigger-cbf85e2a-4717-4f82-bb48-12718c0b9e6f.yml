name: Trigger auto deployment for my-env

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/my-env-AutoDeployTrigger-cbf85e2a-4717-4f82-bb48-12718c0b9e6f.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MYENV_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MYENV_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.MYENV_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: docker.io
          registryUsername: ${{ secrets.MYENV_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.MYENV_REGISTRY_PASSWORD }}
          containerAppName: my-env
          resourceGroup: my-rg
          imageToBuild: boscaleb/my-env:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


