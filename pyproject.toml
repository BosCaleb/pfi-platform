[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

# =============================================================
# Ruff — fast Python linter (replaces flake8, isort, pyupgrade)
# =============================================================
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".venv",
    ".venv312",
    "__pycache__",
    "frontend",
    "data",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (catches undefined names, unused imports, etc.)
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "RUF", # ruff-specific rules
    "ANN201", # missing return type on public functions (type-check lite)
]
ignore = [
    "E501",    # line too long (handled by Black)
    "B008",    # do not perform function calls in default arguments (FastAPI Depends pattern)
    "ANN201",  # return type annotations — noisy on existing code; kept in select for reference
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# =============================================================
# Black — opinionated Python formatter
# =============================================================
[tool.black]
target-version = ["py311"]
line-length = 100
exclude = '''
/(
    \.venv
  | \.venv312
  | __pycache__
  | frontend
  | data
)/
'''

# =============================================================
# Pytest — test runner
# =============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
]
markers = [
    "unit: pure unit tests with no I/O",
    "integration: tests that spin up a real DB or HTTP client",
]

# =============================================================
# Coverage — used with pytest-cov
# =============================================================
[tool.coverage.run]
source = ["app"]
omit = [
    "app/static/*",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60

# =============================================================
# Mypy — static type checking
# Configured for a pragmatic balance: catches real bugs without
# requiring full annotation coverage on existing code.
# =============================================================
[tool.mypy]
python_version = "3.11"

# Don't fail on missing type stubs for third-party packages
# (SQLAlchemy, FastAPI, DuckDB, etc. have partial stubs at best)
ignore_missing_imports = true

# Existing code has many unannotated functions — don't require them
disallow_untyped_defs = false
check_untyped_defs = true

# Warn about things that are clearly bugs regardless of annotations
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

# No strict optional — existing ORM models use nullable columns extensively
no_implicit_optional = false

exclude = [
    "tests/",
    "frontend/",
    "app/static/",
]
