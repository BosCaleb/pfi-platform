#version: '3.8'

name: pfi-platform

services:
  pfi-api:
    build: .
    container_name: pfi-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./app/static:/app/app/static:ro
    environment:
      - DATABASE_URL=duckdb:///./data/pfi.db
      - SECRET_KEY=pfi-platform-secret-key-change-in-production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
