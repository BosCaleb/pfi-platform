# ── nginx/nginx.conf ────────────────────────────────────────────────
# Production reverse proxy for the PFI Platform API.
#
# Usage:
#   Place TLS certificates at:
#     nginx/certs/cert.pem   — full-chain certificate
#     nginx/certs/key.pem    — private key
#
#   Generate a self-signed cert for local testing:
#     mkdir -p nginx/certs
#     openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#       -keyout nginx/certs/key.pem -out nginx/certs/cert.pem \
#       -subj "/CN=localhost"
#
#   For production, use Certbot / Let's Encrypt and mount the
#   certificates into the nginx container (see docker-compose.yml).

# ── Worker tuning ────────────────────────────────────────────────────
worker_processes auto;
worker_rlimit_nofile 8192;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # ── Basic settings ───────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens off;                    # Don't expose nginx version

    # ── Logging ──────────────────────────────────────────────────────
    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ── Rate limiting zones ──────────────────────────────────────────
    # Shared memory zone: 10 MB holds ~160 000 IP entries.
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m   rate=60r/m;

    # ── Docker internal DNS resolver ─────────────────────────────────
    # Resolve upstream hostnames at request time (not config-load time).
    # 127.0.0.11 is Docker's embedded DNS server, always present in any
    # Docker network.  Without this, nginx resolves "pfi-api" once at
    # startup, which races against the container coming up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Gzip ─────────────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied    any;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain;

    # ── HTTP → HTTPS redirect ────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Allow Let's Encrypt ACME challenges through on port 80.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS server ─────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name _;

        # ── TLS ──────────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ── Security headers ─────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff"      always;
        add_header X-Frame-Options           "SAMEORIGIN"   always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

        # ── Buffer / timeout limits ──────────────────────────────────
        client_max_body_size    4M;
        client_body_timeout     12;
        client_header_timeout   12;
        send_timeout            10;
        proxy_read_timeout      60;
        proxy_connect_timeout   10;
        proxy_send_timeout      60;

        # Using a variable forces nginx to resolve "pfi-api" via the
        # Docker DNS resolver at request time, not at startup.
        set $upstream http://pfi-api:8000;

        # ── Login endpoint — strict rate limit ───────────────────────
        # Nginx-level gate (5 req/min burst of 2).  The application-level
        # slowapi limit is an independent second layer.
        location = /api/auth/login {
            limit_req zone=login_zone burst=2 nodelay;
            limit_req_status 429;

            proxy_pass         $upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── API endpoints — general rate limit ───────────────────────
        location /api/ {
            limit_req zone=api_zone burst=20 nodelay;
            limit_req_status 429;

            proxy_pass         $upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Everything else (SPA, docs) ──────────────────────────────
        location / {
            proxy_pass         $upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
